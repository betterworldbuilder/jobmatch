<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center Mockup</title>
<!-- Desi (designer), 2026-10-27. Static mockup, self-contained, no external resources.
     Every value is copied from repo files on 2026-10-27 (sources named next to each value).
     Spec: design/2026-10-27_command-center-spec.md -->
<style>
/* ---------- tokens (light) ---------- */
:root{
  --bg:#f6f7fb;--surface:#fff;--surface-2:#eef0f7;--text:#1b2340;--muted:#56617f;--line:#dfe3ee;
  --brand-1:#fd267a;--brand-2:#ff7a3d;--accent:#c8135c;--cta-1:#d4145a;--cta-2:#c2410c;
  --ok:#17794a;--warn:#935600;--bad:#c0233d;--info:#3b4a8c;--lock:#9aa1b8;
  --glow:rgba(253,38,122,.35);--shadow:0 1px 3px rgba(27,35,64,.08);
  --r-s:8px;--r-m:12px;--r-l:18px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --fs-xs:12px;--fs-s:13px;--fs-m:15px;--fs-l:18px;--fs-xl:24px;--fs-xxl:32px;
  --t-fast:150ms;--t-med:240ms;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1020;--surface:#151a2e;--surface-2:#1f2542;--text:#eceef7;--muted:#a5adca;--line:#2c3354;
  --accent:#ff6aa3;--ok:#4cc38a;--warn:#f0b453;--bad:#ff7a8d;--info:#9fb0ff;--lock:#5d6585;
  --glow:rgba(255,106,163,.4);--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1020;--surface:#151a2e;--surface-2:#1f2542;--text:#eceef7;--muted:#a5adca;--line:#2c3354;
  --accent:#ff6aa3;--ok:#4cc38a;--warn:#f0b453;--bad:#ff7a8d;--info:#9fb0ff;--lock:#5d6585;
  --glow:rgba(255,106,163,.4);--shadow:none;color-scheme:dark}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-m)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--brand-1),var(--brand-2))}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0}
a{color:var(--accent)}
button,select{font:inherit}
.muted{color:var(--muted);font-size:var(--fs-s)}
.src{color:var(--muted);font-size:var(--fs-xs);overflow-wrap:anywhere}
.nd{color:var(--muted);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:var(--s4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:1em;height:1em;vertical-align:-.125em;flex:none}

/* ---------- mockup switcher (not part of the product) ---------- */
.switcher{background:var(--surface);border-bottom:1px solid var(--line)}
.switcher .wrap{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;padding-top:var(--s3);padding-bottom:var(--s3)}
.switcher label{font-size:var(--fs-s);font-weight:700}
.switcher select{padding:6px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface-2);color:var(--text);max-width:100%}
.bestfor{flex-basis:100%;font-size:var(--fs-s);color:var(--muted)}
.bestfor b{color:var(--text)}
.mocknote{flex-basis:100%;font-size:var(--fs-xs);color:var(--muted)}

/* ---------- shared components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);padding:var(--s4);min-width:0}
.cta{display:inline-flex;align-items:center;gap:var(--s2);border:0;border-radius:var(--r-m);padding:12px 18px;min-height:44px;
  font-weight:700;color:#fff;background:linear-gradient(90deg,var(--cta-1),var(--cta-2));cursor:pointer;text-decoration:none}
.cta:hover{filter:brightness(1.07)}
.cta:active{transform:scale(.98)}
.cta.pulse{animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow)}100%{box-shadow:0 0 0 14px transparent}}
.btn2{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-weight:600;font-size:var(--fs-s);cursor:pointer}
.btn2:hover{border-color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.st.active{color:var(--ok)}.st.blocked{color:var(--bad)}.st.idle{color:var(--muted)}.st.new{color:var(--info)}
.st.done{color:var(--ok)}.st.cur{color:var(--accent)}.st.locked{color:var(--muted)}
.ty{display:inline-block;font-size:var(--fs-xs);font-weight:700;padding:1px 8px;border-radius:6px;background:var(--surface-2)}
.ty.result{color:var(--ok)}.ty.feedback{color:var(--info)}.ty.proposal{color:var(--warn)}.ty.blocker{color:var(--bad)}
.xp{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xp>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand-1),var(--brand-2));transition:width var(--t-med)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:var(--fs-s);
  background:var(--surface-2);color:var(--text);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ring,var(--line))}
.av.founder{background:linear-gradient(135deg,var(--cta-1),var(--cta-2));color:#fff}
.ring-active{--ring:var(--ok)}.ring-blocked{--ring:var(--bad)}.ring-new{--ring:var(--info)}
.empty{color:var(--muted);font-style:italic;font-size:var(--fs-s)}
.imag{font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:var(--s2);align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.chk li:last-child{border-bottom:0}
.box{flex:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:4px 12px;min-height:32px;font-size:var(--fs-s);font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:var(--fs-s)}
.log li:last-child{border-bottom:0}
.log .who{font-weight:700}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s2);margin:var(--s5) 0 var(--s3)}
.sec-h h2{font-size:var(--fs-l)}
.kicker{font-size:var(--fs-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* ---------- Option A: strategy HUD ---------- */
.a-hud{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.a-hud .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:var(--s2);padding-top:var(--s2);padding-bottom:var(--s2)}
.a-stat{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:var(--r-s);background:var(--surface-2);min-width:0;text-decoration:none;color:var(--text)}
.a-stat .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.a-stat b{font-size:var(--fs-l)}
.a-stat.hot{background:linear-gradient(90deg,var(--cta-1),var(--cta-2));color:#fff}
.a-stat.hot .l{color:#fff}
.a-top{display:grid;gap:var(--s4);grid-template-columns:1fr}
@media (min-width:900px){.a-top{grid-template-columns:3fr 2fr}}
.a-quest h2{font-size:var(--fs-xl);margin:var(--s1) 0 var(--s2)}
.a-quest .do{margin-top:var(--s4);padding:var(--s3);border-radius:var(--r-m);background:var(--surface-2);display:flex;flex-direction:column;gap:var(--s2)}
.a-goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:var(--s3)}
.a-goals div{font-size:var(--fs-s);padding:6px 8px;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 6px 6px 0}
.a-dl li{display:flex;justify-content:space-between;gap:var(--s2);padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--fs-s)}
.a-dl li:last-child{border-bottom:0}
.a-dl b{white-space:nowrap}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s2);list-style:none;padding:0;margin:0}
.node{position:relative;border:2px solid var(--line);border-radius:var(--r-m);padding:var(--s2);background:var(--surface);min-height:104px;display:flex;flex-direction:column;gap:2px}
.node .id{font-weight:800;font-size:var(--fs-m)}
.node .w{font-size:var(--fs-xs);color:var(--muted)}
.node .c{font-size:var(--fs-xs);margin-top:auto}
.node.done{border-color:var(--ok)}
.node.cur{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.node.locked{border-style:dashed;background:var(--surface-2)}
.node.locked .c{color:var(--muted)}
.node .boss{position:absolute;top:6px;right:6px;color:var(--warn)}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:var(--s3)}
.pm{display:flex;flex-direction:column;gap:var(--s2)}
.pm .hd{display:flex;gap:var(--s3);align-items:center}
.pm .nm{font-weight:800}
.pm .goal{font-size:var(--fs-s)}
.pm .last{font-size:var(--fs-xs);color:var(--muted)}
.pm .ft{display:flex;justify-content:space-between;gap:var(--s2);font-size:var(--fs-xs);color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:auto}
.loot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:var(--s3)}
.loot .card b.n{font-size:var(--fs-xxl);display:block;line-height:1.1}

/* ---------- Option B: RPG quest log ---------- */
.b{max-width:700px;margin:0 auto;padding:var(--s5) var(--s4) var(--s6)}
.b-ch{text-align:center;padding:var(--s5) 0 var(--s4)}
.b-ch h1{font-size:var(--fs-xl);margin:var(--s2) 0}
.b-ch p{color:var(--muted)}
.b-next{border:2px solid var(--accent);border-radius:var(--r-l);padding:var(--s5);background:var(--surface);display:flex;flex-direction:column;gap:var(--s3)}
.b-next h2{font-size:var(--fs-l)}
.b details{border-top:1px solid var(--line);padding:var(--s3) 0}
.b summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center;gap:var(--s2)}
.b-road{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px solid var(--line)}
.b-road li{position:relative;padding:0 0 var(--s3) var(--s3)}
.b-road li::before{content:"";position:absolute;left:-33px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--lock)}
.b-road li.done::before{background:var(--ok);border-color:var(--ok)}
.b-road li.cur::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.b-road li.locked{color:var(--muted)}
.b-voice{display:flex;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.b-voice:last-child{border-bottom:0}
.b-voice p{font-size:var(--fs-s)}
.b-voice q{font-style:italic}

/* ---------- Option C: mobile-game home ---------- */
.c{max-width:560px;margin:0 auto;padding:var(--s4) var(--s4) 96px}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.c-lvl{display:flex;align-items:center;gap:var(--s2);font-weight:800}
.c-lvl .badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--cta-1),var(--cta-2));font-size:var(--fs-s)}
.c-hero{margin-top:var(--s4);border-radius:var(--r-l);padding:var(--s5);color:#fff;background:linear-gradient(135deg,#b3124f,#a6380b)}
.c-hero .kicker{color:#fff;opacity:.9}
.c-hero h2{font-size:var(--fs-xl);margin:var(--s2) 0}
.c-hero .cta{background:#fff;color:#a3104a;width:100%;justify-content:center;font-size:var(--fs-l);min-height:56px;margin-top:var(--s4)}
.c-tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.c-tile{border-radius:var(--r-l);padding:var(--s4);min-height:110px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none}
.c-tile b{font-size:var(--fs-xxl);line-height:1}
.c-tile .l{font-weight:700;font-size:var(--fs-s)}
.c-tile .s{font-size:var(--fs-xs);color:var(--muted)}
.c-rail{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--s2) 2px var(--s3);margin:0;list-style:none}
.c-rail li{scroll-snap-align:start;flex:0 0 132px;min-height:140px;border-radius:var(--r-l);padding:var(--s3);background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;gap:4px}
.c-rail li.done{border-color:var(--ok)}
.c-rail li.cur{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.c-rail li.locked{border-style:dashed;background:var(--surface-2);color:var(--muted)}
.c-rail .id{font-size:var(--fs-l);font-weight:800}
.c-party{display:flex;gap:var(--s3);overflow-x:auto;padding:var(--s2) 4px var(--s3);list-style:none;margin:0}
.c-party li{flex:0 0 72px;text-align:center;font-size:var(--fs-xs)}
.c-party .av{width:56px;height:56px;margin:0 auto 6px;font-size:var(--fs-m)}
.c-feed .card{margin-bottom:var(--s2)}
.c-tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.c-tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;min-height:56px;font-size:var(--fs-xs);font-weight:700;color:var(--muted);text-decoration:none}
.c-tabs a.on{color:var(--accent)}
.c-tabs .ico{width:22px;height:22px}

/* ---------- Option D: clean pro ---------- */
.d-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s3);align-items:flex-end;margin:var(--s3) 0 var(--s4)}
.d-head h1{font-size:var(--fs-xl)}
.d-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:var(--s3)}
.d-kpi .l{font-size:var(--fs-xs);font-weight:700;color:var(--muted)}
.d-kpi b{display:block;font-size:var(--fs-xl);margin:2px 0}
.d-grid{display:grid;gap:var(--s4);grid-template-columns:1fr;margin-top:var(--s4)}
@media (min-width:900px){.d-grid{grid-template-columns:1fr 1fr}}
.d-step{display:flex;list-style:none;padding:0;margin:var(--s2) 0 0;flex-wrap:wrap;gap:4px}
.d-step li{flex:1 1 72px;text-align:center;font-size:var(--fs-xs);padding:6px 2px;border-top:4px solid var(--line);color:var(--muted)}
.d-step li.done{border-color:var(--ok);color:var(--text)}
.d-step li.cur{border-color:var(--accent);color:var(--text);font-weight:800}
.d-step b{display:block;font-size:var(--fs-s)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:var(--fs-xs);color:var(--muted)}
.tbl td{overflow-wrap:anywhere}
@media (max-width:640px){
  .tbl thead{display:none}
  .tbl tr{display:block;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
  .tbl td{display:block;border:0;padding:2px 0}
  .tbl td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:var(--fs-xs);font-weight:700}
}
.ol{margin:0;padding-left:20px}.ol li{margin:var(--s2) 0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style></head>
<body>
<div class="switcher" role="region" aria-label="Mockup controls">
 <div class="wrap">
  <label for="opt">UI option</label>
  <select id="opt">
   <option value="A">A. Strategy-game HUD</option>
   <option value="B">B. RPG quest log</option>
   <option value="C">C. Mobile-game home screen</option>
   <option value="D">D. Clean pro dashboard</option>
  </select>
  <label for="theme">Theme</label>
  <select id="theme">
   <option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option>
  </select>
  <p class="bestfor" id="bestfor" aria-live="polite"></p>
  <p class="mocknote">Static mockup by Desi, 2026-10-27. Same real data in every option, copied from repo files. Buttons do nothing here. Future stages are imagined (<code>docs/vision-backcast.md</code>), never fact.</p>
 </div>
</div>
<div id="view"><noscript><p class="wrap">This mockup needs JavaScript to switch options.</p></noscript></div>

  h+='<section class="card" aria-labelledby="d-now"><h2 id="d-now" style="font-size:15px">Now (in order)</h2><ol class="ol"><li><b>'+esc(NOW.title)+'</b> <span class="muted">due Wed 2026-10-28</span></li>'+THEN.map(function(t){return '<li>'+esc(t)+'</li>';}).join("")+'</ol></section>';
  h+='<section class="card" aria-labelledby="d-obj"><h2 id="d-obj" style="font-size:15px">M1 objectives <span class="muted">'+D.stage.ticked+' of '+D.stage.objectives.length+'</span></h2><ul class="chk">'+D.stage.objectives.map(function(o){return '<li><span class="box" aria-hidden="true"></span>'+esc(o)+'</li>';}).join("")+'</ul></section>';
  h+='</div>';
  h+='<section class="card" style="margin-top:16px" aria-labelledby="d-team"><h2 id="d-team" style="font-size:15px">Team</h2><table class="tbl"><thead><tr><th>Member</th><th>State</th><th>M1 goal</th><th>Latest</th><th>Open</th></tr></thead><tbody>'+D.party.map(function(p){
    return '<tr><td><b>'+esc(p.n)+'</b> <span class="muted">'+esc(p.role)+'</span></td><td data-l="State">'+stBadge(p.st)+'</td><td data-l="M1 goal">'+nd(p.goal)+'</td><td data-l="Latest">'+esc(p.last)+'</td><td data-l="Open">'+p.open+'</td></tr>';
  }).join("")+'</tbody></table></section>';
  h+='<div class="d-grid">';
  h+='<section class="card" aria-labelledby="d-log"><h2 id="d-log" style="font-size:15px">Team board <span class="muted">'+D.stage.id+'</span></h2>'+filterChips("d-logl")+'<ul class="log" id="d-logl" style="margin-top:8px">'+D.board.map(boardLi).join("")+'</ul></section>';
  h+='<div style="display:grid;gap:16px;align-content:start"><section class="card"><h2 style="font-size:15px">Approvals</h2><p style="margin-top:6px">'+D.loot.pass+' drafts passed review · '+D.loot.unreviewed+' not reviewed · '+D.loot.blocked+' blocked · '+D.leads.fresh+' leads NEW</p><button type="button" class="btn2" style="margin-top:10px">Review drafts</button></section>';
  h+='<section class="card"><h2 style="font-size:15px">Decisions</h2><p class="muted" style="margin-top:6px">'+D.openDecisions.length+' open: '+esc(D.openDecisions.join(", "))+'</p></section>';
  h+='<section class="card"><h2 style="font-size:15px">Team meeting</h2>'+emptyMeeting()+'</section></div>';
  h+='</div></div>';
  return h;
}

/* ---------- switcher ---------- */
var BEST = {
  A:"<b>Best for:</b> a founder who scans everything in 10 seconds on a laptop each morning. Dense; sticky HUD; all parts on one screen.",
  B:"<b>Best for:</b> calm focus: one quest at a time, everything else folded. Lowest cognitive load; least overview.",
  C:"<b>Best for:</b> checking from the phone: big thumb targets, swipeable stage rail, bottom tab bar.",
  D:"<b>Best for:</b> showing the page to investors or advisors: professional tables with light game touches. Least fun."
};
var R = {A:renderA,B:renderB,C:renderC,D:renderD};
var opt = document.getElementById("opt"), theme = document.getElementById("theme"), view = document.getElementById("view");
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function show(o){
  if(!R[o]) o="A";
  opt.value=o; view.innerHTML=R[o](); document.getElementById("bestfor").innerHTML=BEST[o]; store("jmn-mock-opt",o);
}
function setTheme(t){
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme");
  theme.value=t||"auto"; store("jmn-mock-theme",t||"auto");
}
view.addEventListener("click",function(e){
  var b=e.target.closest(".chip"); if(!b) return;
  var g=b.parentNode, list=document.getElementById(g.getAttribute("data-for")), f=b.getAttribute("data-f");
  Array.prototype.forEach.call(g.querySelectorAll(".chip"),function(c){c.setAttribute("aria-pressed",String(c===b));});
  Array.prototype.forEach.call(list.children,function(li){li.hidden=!(f==="all"||li.getAttribute("data-type")===f);});
});
opt.addEventListener("change",function(){show(opt.value);});
theme.addEventListener("change",function(){setTheme(theme.value);});
setTheme(store("jmn-mock-theme"));
show(store("jmn-mock-opt")||"A");
})();
</script>
</body></html>
